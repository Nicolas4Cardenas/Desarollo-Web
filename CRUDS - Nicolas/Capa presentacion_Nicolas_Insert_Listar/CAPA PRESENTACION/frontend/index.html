<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoliRestaurante - INSERT y LISTAR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-4">
    <header class="mb-4">
      <h1 class="h3 mb-1">PoliRestaurante</h1>
      <p class="text-muted mb-3">insertar y listar registros</p>
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <nav id="navigation" class="nav nav-pills" aria-label="Secciones">
          <button type="button" class="nav-link active" data-page="pedidos">Pedidos</button>
          <button type="button" class="nav-link" data-page="cocina">Cocina</button>
          <button type="button" class="nav-link" data-page="reportes">Reportes</button>
          <button type="button" class="nav-link" data-page="historial">Historial</button>
        </nav>
        <div class="d-flex align-items-center gap-2">
          <label for="userId" class="form-label mb-0 small">Usuario:</label>
          <select id="userId" class="form-select form-select-sm" aria-label="Usuario activo">
            <option value="1">Administrador</option>
            <option value="4">Cocina</option>
          </select>
        </div>
      </div>
    </header>
    <div id="apiStatus" class="small text-muted mb-3" role="status">Comprobando conexión…</div>
    <h2 id="pageTitle" class="h5 mb-3">Pedidos</h2>
    <section id="content" aria-live="polite"></section>
  </main>
  <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <div class="modal fade" id="editorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h3 id="modalTitle" class="modal-title h5">Nuevo registro</h3><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <form id="editorForm">
          <div class="modal-body" id="modalFields"></div>
          <div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button><button id="saveButton" class="btn btn-primary" type="submit">Insertar</button></div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
